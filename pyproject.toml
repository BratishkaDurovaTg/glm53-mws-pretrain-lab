[project]
name = "compactex"
version = "0.1.0"
description = "Pre-spec R&D lab: transferable schema-conditioned fact extraction pre-model (MWS CompactFactExtraction prep)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14",
]

[project.optional-dependencies]
ml = [
    "torch==2.14.1",
    "transformers==5.20.2",
    "peft==0.21.2",
    "accelerate>=1.0",
    "safetensors>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compactex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ml: tests requiring the ml extra and local weights"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
